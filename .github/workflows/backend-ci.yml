name: Backend CI

on:
  push:
    branches: [ develop ]

permissions:
  contents: write   # needed to commit the dated test summary back to develop
  checks: write
  actions: read

# Run one CI job at a time so report commits never race each other
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test & Report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: npm run report:summarize

      - name: Publish test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: JEST Tests
          path: backend/src/unit_tests/reports/junit.xml
          reporter: jest-junit

      - name: Upload test report as artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            backend/src/unit_tests/reports/junit.xml
            backend/src/unit_tests/reports/test-summary.md

      # Keep only the dated .md summary in the repo (XML is discarded)
      - name: Commit dated test summary to develop
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/unit_tests/reports/test-summary_*.md
          if git diff --cached --quiet; then
            echo "No new test summary to commit."
            exit 0
          fi
          git commit -m "Test report for ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin develop && git push origin HEAD:develop && exit 0
            sleep 5
          done
          echo "Failed to push test report" && exit 1
