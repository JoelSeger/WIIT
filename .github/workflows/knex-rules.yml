name: Check DB Rules

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  check-db:
    name: "Check Knex Rules"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run DB rule checks
        run: npm run check:db
