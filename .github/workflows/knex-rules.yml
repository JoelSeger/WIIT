name: Check DB Rules

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  check-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run DB rule checks
        run: npm run check:db
