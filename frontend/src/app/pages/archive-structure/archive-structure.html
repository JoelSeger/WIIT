<div class="page">

    <div class="page-title">
        <h2>Arkivbildare</h2>
    </div>

    <div class="archive-content">

        <!-- Arkivbildare from the backend (GET /api/archive-creators) -->
        @if (message(); as text) {
            <p class="archive-message" aria-live="polite">{{ text }}</p>
        } @else {
            <div class="archive-cards">
                @for (card of cards(); track card.creator.id) {
                    <a [routerLink]="card.link">{{ card.creator.name }}</a>
                }
            </div>
        }

    </div>

</div>
