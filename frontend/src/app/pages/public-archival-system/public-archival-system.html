<div class="page">
    <div class="page-title">
        <h1>Välkommen till Malmö Universitets Arkivsök</h1>
    </div>

    <div class="archive-content">

        <div class="archive-search">
            <input 
                placeholder="Sök i arkivet..." 
                type="text"
                (input)="onSearch($event)"
            >
               <!-- Display search suggestions -->
    @if (searchResults.length > 0) {
        <div class="search-suggestions">
            @for (result of searchResults; track result.nodeId) {
                <div class="search-suggestion">
                    <span>{{ result.title }}</span>
                </div>
            }
        </div>
    }
        </div>

        <div class="archive-cards">
            <button type="button">
                Allmäna Arkivsystemet
            </button>

            <button type="button">
                Klassificeringsstruktur
            </button>

            <button type="button">
                Förvaringsenheter
            </button>

        </div>

        <div class="archive-login-prompt">
            <p><a href="#">Logga in</a> för att se dina bokmärken och internt publicerade objekt.</p>
        </div>

        <div class="archive-saved-last-page">
            <h3>Senast besökta</h3>
        </div>

    </div>
</div>
