<nav class="nav" aria-label="Huvudnavigation">
  <div class="nav-left">
    <button class="nav-button" type="button"
      (click)="openMenu()" aria-label="Öppna menyn">
      <img [src]="menuIconUrl" alt="" />
    </button>

    <!-- Sandie (import-frontend): the buttons link to their pages -->
    <button class="nav-button" type="button" routerLink="/import-archive" aria-label="Importera EAD-fil">
      <img [src]="addIconUrl" alt="" />
    </button>

    <button class="nav-button" type="button" routerLink="/" aria-label="Startsida">
      <img [src]="homeIconUrl" alt="" />
    </button>

    <button class="nav-button" type="button" routerLink="/export-archive" aria-label="Ladda ner">
      <img [src]="downloadIconUrl" alt="" />
    </button>
  </div>

  <div class = "nav-search">
    <input 
    type="search"
    placeholder="sök..."
    aria-label="Sök i arkivet"
    [value]="searchText"
    (input)="onSearch($event)"
    (keydown.enter)="submitSearch()"
    />

    @if (searchSuggestions().length > 0) {
      <div class="search-suggestions">
        @for (item of searchSuggestions(); track item.nodeId) {
          <button
            type="button"
            (click)="selectSuggestion(item)"
          >
            <span class="suggestion-title">
              {{ item.referenceCode ? item.referenceCode + ' - ' : '' }}{{ item.title }}
            </span>
            <span class="suggestion-path">{{ suggestionPath(item) }}</span>
          </button>
        }
        <!-- Enter does the same: the result page with all hits -->
        @if (searchTotal() > searchSuggestions().length) {
          <button type="button" class="show-all" (click)="submitSearch()">
            Visa alla {{ searchTotal() }} träffar
          </button>
        }
        </div>
      } @else if (searchMessage()) {
        <div class="search-suggestions" role="status">
          <p class="search-message">{{ searchMessage() }}</p>
        </div>
      }
      </div>
    
  

  <div class="nav-right">
    @if (loginService.currentUser()) {
      <button class="nav-button" type="button" (click)="loginService.logout()" aria-label="Logga ut">
        <img [src]="logoutIconUrl" alt="Logga ut" />
      </button>

    } @else {
      <a routerLink="/login" class="nav-button" aria-label="Logga in">
        <img [src]="loginIconUrl" alt="Logga in" />
      </a>
    }
  </div>
</nav>
