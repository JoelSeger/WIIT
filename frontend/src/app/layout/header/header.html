<header class="header">
  <div class="header-logo">
    <img
      [src]="logoUrl"
      [alt]="logoAlt"
      class="logo"
    />

    <span class="university-name">Malmö Universitet</span>
  </div>

  <div class="header-user">
    <span class="user-label">{{ userLabel }}</span>

    <button
      class="user-button"
      type="button"
      (click)="openProfile()"
      aria-label="Användarprofil"
    >
      <img
        [src]="profileIconUrl"
        alt=""
        class="profile-icon"
      />
    </button>
  </div>
</header>
