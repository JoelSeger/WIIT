<header class="header">
  <div class="header-logo">
    <img
      [src]="logoUrl"
      [alt]="logoAlt"
      class="logo"
    />
  </div>

  <div class="header-user">
    @if (loginService.currentUser()) {
      <span class="user-label">{{ loginService.currentUser() }}</span>

      <!-- "Inloggat" läge "-->
      <button
        class="user-button"
        type="button"
        (click)="loginService.logout()" 
        aria-label="Logga ut">
      </button>

      <!-- Besöksläge -->
      }  @else {
          <a routerLink="/login"
            class="user-button"
            aria-label="Logga in">
            <img [src]="profileIconUrl" alt="Logga in" class="profile-icon" />
          </a>
          }
  </div>
</header>
