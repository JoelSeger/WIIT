<aside #menuContainer class="menu" [class.closed]="!isOpen" [style.width.px]="isOpen ? menuWidth : 40">

  <div class="menu-top">
    <button class="menu-toggle" type="button" (click)="toggleMenu()"
      [attr.aria-label]="isOpen ? 'Stäng menyn' : 'Öppna menyn'">
      <img src="/chevron-left.png" alt="" [class.rotated]="!isOpen" />
    </button>
  </div>

  @if (isOpen) {
  <div class="menu-inner">
    
    <div class="menu-content">
      @if (isLoadingStructures()) {
        <div class="loading-text">Laddar strukturer...</div>
      } @else if (structureError()) {
        <div class="error-text">Kunde inte ladda strukturer.</div>
      } @else if (selectedStructureId()) {
        <app-tree-view 
          [structureId]="selectedStructureId()!" 
          (nodeSelected)="onNodeSelected($event)">
        </app-tree-view>
      } @else {
        <div class="loading-text">Inga strukturer hittades.</div>
      }
    </div>

    <div class="menu-bottom">
      <a routerLink="/settings" class="menu-link">
        <img src="/settings.png" alt="" />
        <span>Inställningar</span>
      </a>
    </div>
    
  </div>

  <div class="resize-handle" (mousedown)="startResize($event)"></div>
  }
</aside>
