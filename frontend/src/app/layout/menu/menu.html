<aside 
#menuContainer 
class="menu" 
[class.closed]="!isOpen"
[style.width.px]="isOpen ? menuWidth : 40"
>

  <div class="menu-top">
    <button 
    class="menu-toggle" 
    type="button"
    (click)="toggleMenu()"
    [attr.aria-label]="isOpen ? 'Stäng menyn' : 'Öppna menyn'"
    >

    <img
        src="/chevron-left.png"
        alt=""
        [class.rotated]="!isOpen"
        />
    </button>
  </div>


  <!-- Displays the menu content only when the menu is open -->
  @if (isOpen) {
    <div class="menu-inner">
        <div class="menu-content">
          <!-- F4.3: Struktur and Förvaring with all structures, as in the Figma prototype -->
          <app-tree-view></app-tree-view>
        </div>

  <div class="menu-bottom">
    <a routerLink="/settings" class="menu-link">
      <img src="/settings.png" alt="" />
      <span>Inställningar</span>
    </a>
  </div>
  </div>

  <div class="resize-handle" (mousedown)="startResize($event)"></div>
}
</aside>
